app:
  ambiente: ${BOOK_AMBIENTE}
  jwt-secret: ${BOOK_CHAVE_JWT_SECRET}
  jwt-secure-cookie: true
  permitir-login-local: ${BOOK_PERMITIR_LOGIN_LOCAL}
  empresa: TCIA
  nome-sistema: ${BOOK_NOME_SISTEMA}
  url-site: ${BOOK_URL_SITE}
  url-front-end: ${BOOK_URL_FRONT_END}
  diretorio: ${BOOK_DIRETORIO}
  email:
    habilitado: ${BOOK_EMAIL_HABILITADO}
    remetente: ${BOOK_MAIL_USERNAME}

scheduling:
  processamento:
    cron: ${BOOK_SCHEDULING:0 */1 * * * *} # A cada 1 minuto default
  ociosidade:
    cron: ${BOOK_OCIOSIDADE_SCHEDULING:0 0 3 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

server:
  port: ${BOOK_APP_PORT}
  max-http-request-header-size: 512000
  servlet:
    # O valor é normalizado antes do binding por ContextPathEnvironmentPostProcessor,
    # que tolera BOOK_CONTEXT_PATH vindo como 'book_dinamico', '/book_dinamico/', '' etc.
    context-path: ${BOOK_CONTEXT_PATH:/book_dinamico}
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  config:
    import: optional:file:.env[.properties]
  session:
    store-type: none
  profiles:
    default: dev
  application:
    name: ${BOOK_APP_NAME}
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  datasource:
    url: ${BOOK_DB_URL}
    username: ${BOOK_DB_USERNAME}
    password: ${BOOK_DB_PASSWORD}
    hikari:
      maximum-pool-size: 60
      minimum-idle: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 60000
      validation-timeout: 5000
      connection-test-query: SELECT 1
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  mail:
    host: ${BOOK_MAIL_HOST}
    port: ${BOOK_MAIL_PORT}
    username: ${BOOK_MAIL_USERNAME}
    password: ${BOOK_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
