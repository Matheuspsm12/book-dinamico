# render.yaml — Blueprint do Render.
# Deploy: conecta o repo no Render, ele lê este arquivo e provisiona 3 serviços.
#
# Tier free, 3 serviços:
#   - book-dinamico-db          Postgres (1 GB, expira em 90 dias)
#   - book-dinamico-backend     Spring Boot Docker (sleep após 15min inativo)
#   - book-dinamico-frontend    Next.js standalone Docker (sleep após 15min inativo)
#
# ⚠️ NÃO há disco persistente no free tier. Uploads de arquivos (Phase 5)
#    são perdidos a cada deploy/restart do backend. Aceitável pra demo.

databases:
  - name: book-dinamico-db
    plan: free
    region: ohio                  # mesma região do backend pra reduzir latência
    databaseName: book_dinamico
    user: book_user
    # postgresVersion não setado = Render escolhe padrão (Postgres 16)

services:
  # ----------------------------------------------------------------
  # Backend Spring Boot
  # ----------------------------------------------------------------
  - type: web
    name: book-dinamico-backend
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /book_dinamico/v3/api-docs
    envVars:
      - key: BOOK_AMBIENTE
        value: PRO
      - key: BOOK_APP_NAME
        value: book_dinamico_backend
      - key: BOOK_APP_CONTEXT_PATH
        value: /book_dinamico
      - key: BOOK_NOME_SISTEMA
        value: Book Dinâmico
      - key: BOOK_URL_SITE
        value: https://book-dinamico-backend.onrender.com/book_dinamico
      - key: BOOK_URL_FRONT_END
        value: https://book-dinamico-frontend.onrender.com
      - key: BOOK_DIRETORIO
        # Tmp dir — files perdidos a cada restart. Documentado em DEPLOY.md.
        value: /tmp/book-dinamico
      - key: BOOK_JWT_SECRET
        # Render gera valor aleatório e seguro na primeira deploy
        generateValue: true
      - key: BOOK_DB_HOST
        fromDatabase:
          name: book-dinamico-db
          property: host
      - key: BOOK_DB_PORT
        fromDatabase:
          name: book-dinamico-db
          property: port
      - key: BOOK_DB_NAME
        fromDatabase:
          name: book-dinamico-db
          property: database
      - key: BOOK_DB_USERNAME
        fromDatabase:
          name: book-dinamico-db
          property: user
      - key: BOOK_DB_PASSWORD
        fromDatabase:
          name: book-dinamico-db
          property: password
      # Render Postgres exige SSL — append ao JDBC URL composto via application.yml
      - key: BOOK_DB_PARAMS
        value: "?sslmode=require"
      - key: BOOK_EMAIL_HABILITADO
        value: "false"
      # Mail placeholders — só ativar quando configurar SMTP real
      - key: BOOK_MAIL_HOST
        value: smtp.gmail.com
      - key: BOOK_MAIL_PORT
        value: "587"
      - key: BOOK_MAIL_USERNAME
        value: noreply@example.com
      - key: BOOK_MAIL_PASSWORD
        value: placeholder
      # Heap pequena pra caber no free tier (512MB de RAM)
      - key: JAVA_OPTS
        value: "-Xmx400m -Xms128m"

  # ----------------------------------------------------------------
  # Frontend Next.js
  # ----------------------------------------------------------------
  - type: web
    name: book-dinamico-frontend
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /login
    envVars:
      # Embutido no bundle pelo Dockerfile via ARG → ENV. Render passa em build.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://book-dinamico-backend.onrender.com/book_dinamico
