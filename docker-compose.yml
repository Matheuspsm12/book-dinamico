# docker-compose.yml — desenvolvimento local com containers (paridade com cloud).
#
# Uso:
#   docker compose up --build
#
# Acessa em:
#   Frontend:   http://localhost:3000
#   Backend:    http://localhost:8082/book_dinamico
#   Postgres:   localhost:5432  (user/password/db conforme env abaixo)
#
# Admin seedado pela migration V5: admin@claro.com.br / admin

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: book_dinamico
      POSTGRES_USER: book_user
      POSTGRES_PASSWORD: book_pass
    ports:
      # Host 5433 → container 5432, pra não colidir com Postgres local na 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book_user -d book_dinamico"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      BOOK_AMBIENTE: DEV
      BOOK_APP_NAME: book_dinamico_backend
      BOOK_APP_CONTEXT_PATH: /book_dinamico
      BOOK_APP_PORT: "8082"
      BOOK_NOME_SISTEMA: Book Dinâmico
      BOOK_URL_SITE: http://localhost:8082/book_dinamico
      BOOK_URL_FRONT_END: http://localhost:3000
      BOOK_DIRETORIO: /data/book-dinamico
      BOOK_JWT_SECRET: TrocaIssoPorUmaStringLongaAleatoria
      BOOK_DB_URL: jdbc:postgresql://db:5432/book_dinamico
      BOOK_DB_USERNAME: book_user
      BOOK_DB_PASSWORD: book_pass
      BOOK_EMAIL_HABILITADO: "false"
      BOOK_MAIL_HOST: smtp.gmail.com
      BOOK_MAIL_PORT: "587"
      BOOK_MAIL_USERNAME: noreply@example.com
      BOOK_MAIL_PASSWORD: placeholder
    ports:
      - "8082:8082"
    volumes:
      - bookfiles:/data/book-dinamico

  frontend:
    build:
      context: ./reversa-claro-book-frontend
      dockerfile: Dockerfile
      args:
        # API URL precisa ser build-time pra ser embutida no bundle estático
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8082/book_dinamico
    depends_on:
      - backend
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  pgdata:
  bookfiles:
