# Include this inside the server/location that proxies Book Dinamico.
# The application accepts uploads up to 500 MB; 550m leaves room for multipart
# metadata and avoids Nginx rejecting valid files before Spring handles CORS.
client_max_body_size 550m;

# Keep TLS termination at Nginx and proxy plain HTTP to the Spring Boot port.
# Do not use https:// in proxy_pass unless the backend itself has SSL enabled.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
